[device]
codename = "haydn"
brand = "Redmi"
model = "Redmi K40 Pro"
ab = true
soc = { hans = "骁龙®888移动平台", hant = "Snapdragon® 888 行動平台", en = "Snapdragon® 888 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The panel is 1080 by 2400; the density is the one the Chinese system
# starts this panel at.
width = 1080
height = 2400
density = 440

# The recovery and the system share one boot image: the phone has no
# partition of its own for the recovery, and its boot ramdisk carries both
# the recovery and the first stage of the system. The properties are left as
# the phone built them, since the system reads them too, and only what lets
# adb in as root is added to them.
#
# The bootloader starts the recovery only when misc asks for it, so entering
# it takes `fastboot reboot recovery` (or `adb reboot recovery`); the system
# starts from the same image when nothing asks.
[recovery]
partition = "boot"
shares_boot_ramdisk = true
root_adb = true
