[device]
codename = "haydn"
brand = "Redmi"
model = "Redmi K40 Pro"
ab = true
soc = { hans = "骁龙®888移动平台", hant = "Snapdragon® 888 行動平台", en = "Snapdragon® 888 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The panel is 1080 by 2400; the density is the one the Chinese system
# starts this panel at.
width = 1080
height = 2400
density = 440

# The recovery and the system share one boot image: the phone has no
# partition of its own for the recovery, and its boot ramdisk carries both
# the recovery and the first stage of the system. Building on it keeps the
# phone's own properties as they are, which the system reads as well.
[recovery]
partition = "boot"
shares_boot_ramdisk = true
